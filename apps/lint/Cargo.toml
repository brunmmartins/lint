# Composition root and every adapter for lint (ADR-0002). The only crate allowed to depend on
# pulldown-cmark or clap (ADR-0003, ADR-0004).
[package]
name = "lint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lint-domain.workspace = true
lint-application.workspace = true
pulldown-cmark.workspace = true
clap.workspace = true
