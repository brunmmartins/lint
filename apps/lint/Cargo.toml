# Composition root and every adapter for lint. The only crate allowed to depend on pulldown-cmark or
# clap, so parsing and argument-handling libraries stay out of the domain and application crates.
[package]
name = "lint"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lint-domain.workspace = true
lint-application.workspace = true
pulldown-cmark.workspace = true
clap.workspace = true
