# rust-delivery configuration for lint.
#
# This file belongs to the project. The installer wrote it once and the sync never overwrites it. The sync
# reads it at every session start, together with .delivery/extensions/ and .delivery/local/. After an edit,
# run `python3 .delivery/sync.py sync` to apply it now, or start a new session. .delivery/README.md
# describes every extension point.

schema = 1

[project]
name = "lint"
# Shown to agents wherever they need the card ID format, for example "DCN-NNN".
work_item_scheme = "LINT-NNN"

[sync]
# auto:   SessionStart hooks adopt template updates as they appear.
# pinned: sessions only report updates, and `python3 .delivery/sync.py sync` adopts them deliberately.
mode = "auto"
# The tools to generate files for.
tools = ["claude", "codex"]

# The command contract the agents run. Change these when the project differs from the skeleton
# justfile, for example the plain Cargo fallbacks P §22 describes when `just` is not installed.
[commands]
# check_fast = "just check-fast"
# check = "just check"
# ci_check = "CI=true just check"
# test = "just test"
# lint = "just lint"
# fmt = "just fmt"
# docs = "just docs"
# deny = "just deny"

# Free-form values that project extensions and project-local components can use as {{vars.<key>}}.
[vars]
# consensus_crate = "crates/consensus"

# Per-agent settings. Every key is optional.
#
# [agents.rust-release-steward]
# enabled = false                        # stop generating it; the orchestrator stops routing to it
# extra_skills = ["docchain-activation"] # more skills for it: template skills or .delivery/local/ skills
# claude = { model = "opus", effort = "high" }
# codex = { model_reasoning_effort = "high", sandbox_mode = "workspace-write" }

# Per-skill settings.
#
# [skills.rust-supply-chain-security]
# enabled = true
# claude = { paths = "Cargo.toml,**/Cargo.toml,Cargo.lock,deny.toml" }

# Project-specific stages. Each route adds a row to the orchestrator's "Project routes" table. The agent
# must exist: a template agent, or a project agent in .delivery/local/agents/.
#
# [[routes]]
# trigger = "the change touches {{vars.consensus_crate}} or any consensus-path module"
# agent = "docchain-consensus-reviewer"
# after = "rust-quality-reviewer"
# gate = "the consensus review returns pass, and the activation height is recorded in an ADR"
