# Workspace manifest for lint.
#
# List every crate in `members` explicitly, and only once it exists. A crate missing from the list is
# silently left out of every `--workspace` command, including the quality gate. A glob such as
# "crates/*" is not a shortcut: Cargo rejects a glob that matches no directory.

[workspace]
members = ["crates/domain", "crates/application", "apps/lint"]
# Set explicitly: a virtual manifest does not take its resolver from the edition.
resolver = "3"

# Members opt in with `edition.workspace = true`, `license.workspace = true`, and
# `publish.workspace = true`. A member that omits a key does not inherit it.
[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
# Set `publish = true` on a member only once that crate is meant to be published to a registry.
publish = false
# rust-version = "x.y"   # Only once the project promises an MSRV, and with a CI job that builds with it.

# One version per dependency. Members use it with `name.workspace = true`. Add each dependency with a
# reviewed, current version when the first crate needs it.
[workspace.dependencies]
lint-domain = { path = "crates/domain" }
lint-application = { path = "crates/application" }
# CommonMark parser. Depended on only by apps/lint (never crates/domain or crates/application), so the
# domain and application crates stay free of parser types.
pulldown-cmark = "0.13.4"
# Command-line argument parser. Depended on only by apps/lint.
clap = { version = "4.6.6", features = ["derive"] }

# Members opt in with `[lints] workspace = true`. A member without that section gets no lint policy.
# Keep only the lint levels the project will maintain. Warnings are denied on the command line, never
# with `#![deny(warnings)]` in source, which would let any new compiler warning break the build for
# everyone who compiles it.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"
unwrap_used = "warn"

# Build profiles go below. Measure with `cargo build --timings` before adding anything.
# Settings that change codegen change what is tested, so keep them here rather than in personal config.
#
# [profile.release]
# overflow-checks = ...   # Undecided: release builds wrap on integer overflow unless this is true.
#                         # Decide before the first release build.
