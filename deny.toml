# Dependency policy for lint, checked by `just deny`.
#
# Every exception carries a reason, an owner, and a removal condition. Scanner output is triaged for
# reachability and exposure, not accepted or dismissed on its score.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # { id = "RUSTSEC-YYYY-NNNN", reason = "<why not exploitable here>; owner <name>; remove when <condition>" },
]

[licenses]
# The third-party licence allow-list. Widening it is a deliberate licence-policy change, not a build
# fix. Unicode-3.0 is here because almost every proc-macro dependency brings it.
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93
# An allowed licence that no dependency uses yet is not a finding.
unused-allowed-license = "allow"
exceptions = [
    # { allow = ["<SPDX id>"], crate = "<crate>", reason = "<why>; owner <name>; remove when <condition>" },
]

[licenses.private]
# Workspace crates are unpublished (`publish = false`), and their licence is the project's own.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between unpublished workspace crates are not wildcard version requirements.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
